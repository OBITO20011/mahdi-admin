<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<title>النواصرة لتجارة الجملة والمواد الغذائية</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6eee3;color:#4b2d1b;font-family:Tahoma,Arial,sans-serif}
.frame{position:absolute;inset:30px;border:1px solid #c69a50;border-radius:28px}
.accent{position:absolute;inset:48px auto 48px 54px;width:7px;border-radius:10px;background:#b88637}
.symbol{position:absolute;left:90px;top:153px;width:470px;height:330px;overflow:hidden;border-radius:24px;mix-blend-mode:multiply}
.symbol img{position:absolute;max-width:none;width:742px;height:750px;left:-125px;top:-110px}
main{position:absolute;right:85px;top:140px;width:560px;text-align:right}
h1{font-size:76px;line-height:1.35;margin:0 0 14px;font-weight:900}
.full-name{display:block;font-size:34px;line-height:1.65;font-weight:700}
.rule{height:3px;width:88px;background:#b88637;margin:27px 0}
p{font-size:25px;line-height:1.9;margin:0;white-space:nowrap}
</style>
<div class="frame"></div><div class="accent"></div>
<!-- Crop only the cart/packages (x125,y110,w470,h330). The original logo is unchanged. -->
<div class="symbol" aria-hidden="true"><img src="../public/nawasrah-logo-square.png" alt=""></div>
<main><h1>النواصرة<span class="full-name">لتجارة الجملة والمواد الغذائية</span></h1><div class="rule"></div><p>مواد غذائية ومشروبات بالجملة — الرمثا</p></main>
</html>
