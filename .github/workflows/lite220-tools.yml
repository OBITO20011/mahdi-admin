name: Nawasrah lite220 owner tools
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lite220-tools-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  literal220:
    name: Literal220 migration and full parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/sales-only220-compiler.test.ts tests/owner-tools220.test.ts tests/upgrade220-protection.test.ts tests/upgrade220-lite-data.test.ts tests/reset220-private-scope.test.ts tests/sales-only220-readiness.test.ts tests/d1-reference220-kit.test.ts tests/sales-only-phase3-history.test.ts tests/sales-only220-workbook-fixture.test.ts
      - run: node scripts/testing/run-sales-only220-migration.mjs
      - run: node scripts/testing/capture-sales-only220-catalog.mjs
      - run: node scripts/testing/generate-sales-only220-catalog-pins.mjs
      - run: git diff --exit-code -- docs/generated/DB_FUNCTIONS.md docs/design/sales-only-phase3/catalog220-pins.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lite220-literal-synthetic-proof
          path: |
            test-results/sales-only220-migration/report.json
            test-results/sales-only220-catalog/report.json
            test-results/sales-only220-catalog/fresh-incremental-differences.json
          retention-days: 7
          if-no-files-found: error
  reset220:
    name: RESET220 interruption and private fence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/operations/build-acl-reference220.mjs --output "$RUNNER_TEMP/local-reference-through220-ready.json"
      - run: node scripts/testing/run-reset220-cli-contract.mjs "$RUNNER_TEMP/local-reference-through220-ready.json"
      - run: node scripts/testing/run-reset220-resume-runtime.mjs "$RUNNER_TEMP/local-reference-through220-ready.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lite220-reset-synthetic-proof
          path: test-results/reset220-resume/report.json
          retention-days: 7
          if-no-files-found: error
  upgrade220:
    name: Upgrade220 encrypted protection chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/operations/build-acl-reference220.mjs --output "$RUNNER_TEMP/local-reference-through220-ready.json"
      - run: node scripts/testing/run-owner-upgrade220-runtime.mjs "$RUNNER_TEMP/local-reference-through220-ready.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lite220-upgrade-synthetic-summary
          path: ${{ runner.temp }}/nawasrah-owner-upgrade220-*/summary.json
          retention-days: 7
          if-no-files-found: error
  rehearsal220:
    name: Lite220 owner-size go-live and later activation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix customer-web ci
      - run: node scripts/operations/build-acl-reference220.mjs --output "$RUNNER_TEMP/local-reference-through220-ready.json"
      - run: node scripts/testing/run-lite220-rehearsal.mjs "$RUNNER_TEMP/local-reference-through220-ready.json"
      - run: node scripts/testing/run-sales-only220-epoch.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lite220-rehearsal-synthetic-summary
          path: |
            test-results/lite220-rehearsal/summary.json
            test-results/sales-only220-epoch/report.json
          retention-days: 7
          if-no-files-found: error
