name: Nawasrah parcel integrity226
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parcel226-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  protect:
    name: 226 parcel, reference and owner protection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/operations/build-acl-reference226.mjs --output "$RUNNER_TEMP/local-reference-through226-ready.json"
      - run: node scripts/testing/run-owner-upgrade226-runtime.mjs "$RUNNER_TEMP/local-reference-through226-ready.json"
      - run: node scripts/testing/run-reset226-runtime.mjs "$RUNNER_TEMP/local-reference-through226-ready.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parcel226-protection
          path: |
            test-results/owner-upgrade226/report.json
            test-results/reset226/report.json
          retention-days: 7
