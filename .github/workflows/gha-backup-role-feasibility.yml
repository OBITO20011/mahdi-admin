name: Nawasrah backup reader feasibility
on:
  push:
    branches: ['codex/frankfurt-nightly-actions']
    paths:
      - 'scripts/testing/run-gha-backup-custom-role-feasibility.mjs'
      - '.github/workflows/gha-backup-role-feasibility.yml'
permissions:
  contents: read
concurrency:
  group: backup-reader-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-role-probe:
    name: Disposable Supabase role feasibility only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synthetic test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Prove current Supabase role and PUBLIC grant behavior on synthetic DB
        run: node scripts/testing/run-gha-backup-custom-role-feasibility.mjs
      - name: Retain safe boolean and permission proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-reader-feasibility
          path: /tmp/nawasrah-gha-custom-role-feasibility/report.json
          if-no-files-found: error
          retention-days: 7
