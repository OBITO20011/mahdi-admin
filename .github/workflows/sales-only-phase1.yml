name: Quarantined sales-only phase1
on:
  pull_request:
    paths:
      - 'docs/design/sales-only-phase1/**'
      - 'scripts/testing/*sales-only-phase1*'
      - 'scripts/testing/*sales-only-phase2*'
      - 'docs/design/sales-only-phase2/**'
      - 'tests/sales-only-phase1.test.ts'
      - 'tests/sales-only-phase2.test.ts'
      - '.github/workflows/sales-only-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sales-only-phase1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  isolated-prototype:
    name: Isolated219 prototype and exact full-mode parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/sales-only-phase1.test.ts tests/sales-only-phase2.test.ts tests/sales-only-phase2-edge.test.ts tests/guest-order-security-gateway.test.ts
      - run: node scripts/testing/run-sales-only-phase1.mjs
      - name: Preserve synthetic result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-only-phase1-local-proof
          path: test-results/sales-only-phase1/report.json
          retention-days: 7
          if-no-files-found: error
  phase2-isolated:
    name: Phase2 isolated219 (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [foundations, commercial, pos, guest, lifecycle, return, epoch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/testing/run-sales-only-phase2-${{ matrix.suite }}.mjs
      - name: Preserve isolated synthetic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-only-phase2-${{ matrix.suite }}
          path: test-results/sales-only-phase2-${{ matrix.suite }}/report.json
          retention-days: 7
          if-no-files-found: error
